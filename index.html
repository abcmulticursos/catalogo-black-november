<!doctype html>
<html lang="es" data-catalog="black-november" data-theme="black-november" style="--accent: #a800ff;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Isabel Premium Academy | Black November</title>
  <link rel="icon" href="assets/logo-premium.ico" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* «Habla con tu asesor»: el botón de WhatsApp, con texto, más grande y más visible. */
    html[data-theme="black-november"] .whatsapp-button {
      right: 18px;
      bottom: 18px;
      gap: 8px;
      min-height: 52px;
      padding: 0 20px;
      background: #25d366;
      font-size: 1rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }
    html[data-theme="black-november"] .whatsapp-button svg { width: 22px; height: 22px; }
    @media (max-width: 760px) {
      /* En el celular: «Explorar los 4 cursos» y «Habla con tu asesor», mitad y mitad, abajo. */
      html[data-theme="black-november"] .black-explore-button {
        right: calc(50% + 5px);
        left: 10px;
        min-height: 52px;
        padding: 0 10px;
        font-size: 0.86rem;
      }
      html[data-theme="black-november"] .whatsapp-button {
        right: 10px;
        left: calc(50% + 5px);
        bottom: 14px;
        width: auto;
        min-height: 52px;
        padding: 0 10px;
        font-size: 0.86rem;
      }
      html[data-theme="black-november"] .whatsapp-button span { display: inline; }
    }
  </style>
</head>

  <div id="app">
    <header class="topbar">
      <button class="brand-button" id="ir-portada" aria-label="Ir a la portada">

      <nav class="top-actions" aria-label="Acciones del catálogo">
        <button class="icon-button hide-small" data-accion="anterior" aria-label="Página anterior" title="Página anterior"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
        <button class="counter-button" id="contador" data-accion="menu" aria-label="Página actual">1 / 37</button>
        <button class="icon-button hide-small" data-accion="siguiente" aria-label="Página siguiente" title="Página siguiente"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
        <button class="cta-button" data-accion="menu">Ver los 4 cursos</button>
        <button class="icon-button" data-accion="buscar" aria-label="Buscar" title="Buscar"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
        <button class="icon-button" data-accion="menu" aria-label="Abrir menú" title="Contenido"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg></button>
      </nav>
    </header>

    <main class="catalog-shell">
      <section class="reader-stage" aria-label="Catálogo navegable">
        <button class="side-nav side-nav-left" data-accion="anterior" aria-label="Página anterior" title="Página anterior"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
        <div class="book-wrap">
          <div id="book" class="book"></div>
        </div>
        <button class="side-nav side-nav-right" data-accion="siguiente" aria-label="Página siguiente" title="Página siguiente"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
        <div class="bn-offer-slot" id="oferta"></div>
      </section>
      <button class="black-explore-button" data-accion="menu"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg> Explorar los 4 cursos</button>
    </main>

    <section class="search-drawer" id="buscador" aria-label="Búsqueda">
      <div class="drawer-header">
        <h2>Buscar en el catálogo</h2>
        <button class="icon-button dark" data-accion="cerrar" aria-label="Cerrar búsqueda" title="Cerrar"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
      <input class="search-input" id="busqueda" type="search" placeholder="Busca una prenda, módulo o técnica">
      <div class="search-results" id="resultados"><p class="empty-message">Escribe una palabra para encontrar una hoja.</p></div>
    </section>

    <aside class="menu-drawer" id="menu" aria-label="Tabla de contenidos">
      <div class="drawer-header">
        <div><p class="drawer-kicker">Black November</p><h2>Elige tu curso</h2></div>
        <button class="icon-button dark" data-accion="cerrar" aria-label="Cerrar menú" title="Cerrar"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
      <div class="menu-list" id="lista-cursos"></div>
    </aside>

    <button class="drawer-backdrop" id="fondo" data-accion="cerrar" aria-label="Cerrar panel"></button>

    <a class="whatsapp-button" href="https://walink.co/jqg0nf" target="_blank" rel="noopener" aria-label="Habla con tu asesor">

  <script src="vendor/page-flip.browser.js"></script>
  <script src="app.js"></script>
</body>
</html>
